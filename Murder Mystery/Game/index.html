<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <style>
        @import url('https://fonts.cdnfonts.com/css/red-undead');
        @import url('https://fonts.cdnfonts.com/css/halloween-carnival');
        @import url('https://fonts.cdnfonts.com/css/horror-type');
    </style>
    <title>Murder Mystery Party - Game</title>
    <link href="style.css" rel="stylesheet" type="text/css" />
    <link href="../Styles/homeButton.css" rel="stylesheet" type="text/css" />
    <link href="../Styles/fog.css" rel="stylesheet" type="text/css" />
    <link href="../Styles/candle.css" rel="stylesheet" type="text/css" />
</head>

<body>
    <!-- Back to Home Button -->
    <button id="back-to-home" onclick="location.href='../index.html'"></button>
    
    <!-- Single Fog Overlay Layer -->
    <div id="opacity" class="fog-layer"></div>

    <!-- Single Candle Overlay Layer -->
    <div class="candle"></div>


    <h1>Game Story Generator</h1>
    <form id="storyForm">
        <label for="numPlayers">Number of Players:</label>
        <input type="number" id="numPlayers" name="numPlayers" min="1" max="10" required>

        <label for="playerArchitypes">Player Architypes (comma separated):</label>
        <input type="text" id="playerArchitypes" name="playerArchitypes" placeholder="Warrior, Mage, Rogue" required>

        <label for="theme">Theme / Adjectives (comma separated):</label>
        <input type="text" id="theme" name="theme" placeholder="Fantasy, Dark, Heroic" required>

        <label for="gameLength">Game Length (minutes): <span id="gameLengthValue">90</span></label>
        <input type="range" id="gameLength" name="gameLength" min="30" max="180" value="90" step="5">
        
        <button type="submit">Generate Story</button>
    </form>

    <div id="storyOutput">
        <!-- Generated story will be displayed here -->
    </div>
    <script src="script.js"></script>
</body>
</html>
